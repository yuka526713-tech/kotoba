<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#1b1e25; --muted:#646b7a; --line:#dfe2e8; --soft:#f5f6f8;
  --accent:#4269d8; --accent-ink:#ffffff; --stage:#dde1e7; --focus:#2f6bdb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14161b; --panel:#1d2027; --ink:#e7e9ee; --muted:#9aa1ae; --line:#2e323b; --soft:#252932;
    --accent:#93aeff; --accent-ink:#1a0d0b; --stage:#0f1115; --focus:#79a6ff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14161b; --panel:#1d2027; --ink:#e7e9ee; --muted:#9aa1ae; --line:#2e323b; --soft:#252932;
  --accent:#93aeff; --accent-ink:#1a0d0b; --stage:#0f1115; --focus:#79a6ff;
}
[hidden]{display:none !important}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:14px;padding-inline:16px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{max-width:1240px;margin:0 auto;padding-block:16px 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.02em}
.brand .mark{width:30px;height:30px;object-fit:contain;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg)}
.acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent}

.main{display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:24px;align-items:start}
.editor{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row > .fld{flex:1 1 110px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:12px;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:7px 9px;min-width:0}
textarea.inp{resize:vertical;line-height:1.5}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.hint code{background:var(--soft);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.av-edit{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av-prev{width:40px;height:40px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}

.list{display:flex;flex-direction:column;gap:8px}
.it{border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--soft);border-left-width:4px}
.it.them{border-left-color:#9aa3b2}
.it.me{border-left-color:var(--accent)}
.it.neutral{border-left-color:transparent;border-style:dashed;border-left-style:solid}
.it-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.it-top .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.it select.inp{width:auto;padding:3px 6px;font-size:12px}
.it .time{width:66px;padding:3px 6px;font-size:12px}
.it .inp.w{flex:1 1 90px;width:auto;padding:3px 6px;font-size:12px}
.ib{border:0;background:none;cursor:pointer;color:var(--muted);width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--panel);color:var(--ink)}
.it textarea.inp{background:var(--panel);padding:5px 8px}
.thumb{width:60px;height:60px;border-radius:8px;background-size:cover;background-position:center;background-color:var(--line)}
.adds{display:flex;flex-wrap:wrap;gap:6px}

.pv{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--stage);border-radius:16px;padding:20px 12px;min-width:0}
.dev-wrap{width:calc(414px * var(--k,1));height:calc(868px * var(--k,1));max-width:100%}
.device{width:414px;height:868px;transform:scale(var(--k,1));transform-origin:top left;background:#0c0d10;border-radius:58px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.25),inset 0 0 0 2px #2a2c31}
.device .screenbox{width:390px;height:844px;border-radius:46px;overflow:hidden;background:#000}
.pv-note{font-size:12px;color:var(--muted);text-align:center;max-width:420px;line-height:1.6;margin:0}

@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .pv{position:static;order:-1}
  .acts{margin-left:0}
}

/* fullscreen player */
#fs{position:fixed;inset:0;background:#000;z-index:50;overflow:hidden;cursor:pointer;touch-action:manipulation}
#fsScreen{position:absolute;top:0;transform-origin:top left}
#fsExit{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(128,128,128,.25);color:#fff;opacity:.25;cursor:pointer;z-index:2;font-size:18px}
#fsExit:hover,#fsExit:focus-visible{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--panel);border-radius:14px;padding:16px;max-width:620px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.mbox img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.mlist .saveall{grid-column:1/-1;width:100%;padding:14px;font-size:16px}
.mlist figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.mlist figcaption{font-size:12px;color:var(--muted);text-align:center}
.mbox p{margin:0;line-height:1.6}
#stage{position:fixed;left:-6000px;top:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:70;font-size:13px}

/* ===== phone screen (fixed px: 390pt wide) ===== */
.scr{position:relative;width:390px;overflow:hidden;display:flex;flex-direction:column;font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;color:#111;background:#fff;line-height:1.4;-webkit-font-smoothing:antialiased;text-align:left;cursor:default}
.sb{height:50px;display:flex;align-items:center;justify-content:space-between;padding:8px 28px 0 36px;font-size:16px;font-weight:700;flex:none;letter-spacing:.01em}
.sb-l{min-width:40px;font-variant-numeric:tabular-nums}
.sb-r{display:flex;gap:6px;align-items:center;font-size:12px}
.sb-off{height:10px;flex:none}
.home{height:30px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;flex:none}
.home i{display:block;width:134px;height:5px;border-radius:3px;background:#111}
.home.light i{background:#fff}

.c-head{background:#fff;flex:none;border-bottom:1px solid #e6e8ec}
.typing-end{margin:10px 0 4px;padding:12px 14px;border:1.5px dashed #9bb0e8;border-radius:12px;background:#f3f6ff;display:flex;flex-direction:column;gap:6px}.typing-end-t{font-size:12px;font-weight:700;color:#3c55b5}.typing-end .chk{font-size:14px;font-weight:600}.typing-end small{font-size:12px;color:#6b7280}
.typing-opt{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#4a5160}
.c-bar{height:48px;display:flex;align-items:center;padding:0 14px 0 6px;gap:4px}
.c-back{display:flex;align-items:center;font-size:16px;font-weight:500;min-width:48px}
.c-title{flex:1;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-icons{display:flex;gap:18px;align-items:center}
.c-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:safe flex-end;padding:10px 12px 12px;background-size:cover;background-position:center;--meta:rgba(0,0,0,.45);--nm:#4a4f59}
.c-body.dk{--meta:rgba(255,255,255,.7);--nm:rgba(255,255,255,.85)}
.c-body.c-start{justify-content:flex-start}
u.comp{text-decoration:underline;text-decoration-thickness:1.6px;text-underline-offset:3px;text-decoration-color:#4b5360}u.comp.sel{background:#cfdcff;border-radius:3px;text-decoration-color:#3b64d8}
.prop-kb-top .cands{display:flex;flex:1;min-width:0;overflow:hidden;align-items:center;height:100%}.prop-kb-top .cand{border:0;background:none;color:#000;font:inherit;font-size:19px;padding:0 13px;height:32px;line-height:32px;border-right:1px solid #b9bcc4;flex:0 1 auto;white-space:nowrap;max-width:none;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.prop-kb-top .cand.first{font-weight:600}.prop-kb-top .kb-label{padding:0 4px}
.bulk-inline{margin-top:16px;padding-top:14px;border-top:1px dashed #b9c4de}.bulk-inline h4{margin:0 0 8px;font-size:14px;color:#3c55b5}.talk-row[data-talk-open]{cursor:pointer}.talk-row[data-talk-open]:active{background:#eef1f4}
.c-date{text-align:center;margin:14px 0 4px;flex:none}
.c-date span,.c-sys{display:inline-block;background:rgba(0,0,0,.2);color:#fff;font-size:12px;padding:3px 12px;border-radius:12px}
.c-sys{align-self:center;margin:10px 0 2px;max-width:320px;text-align:center}
.c-row{display:flex;gap:7px;margin-top:10px;flex:none}
.c-row.cont{margin-top:4px}
.c-row.me{justify-content:flex-end;align-items:flex-end}
.c-row.them{align-items:flex-start}
.c-av{width:36px;height:36px;border-radius:50%;flex:none;background-size:cover;background-position:center;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.bn-call .c-av{width:50px;height:50px;font-size:21px}
.c-av.sp{visibility:hidden;height:1px}
.c-col{display:flex;flex-direction:column;gap:3px;min-width:0}
.c-nm{font-size:12px;color:var(--nm);padding-left:3px}
.c-line{display:flex;align-items:flex-end;gap:5px}
.c-meta{display:flex;flex-direction:column;font-size:10.5px;color:var(--meta);line-height:1.35;white-space:nowrap;padding-bottom:1px}
.me .c-meta{align-items:flex-end}
.bub{max-width:246px;padding:8px 13px;border-radius:19px;font-size:15px;line-height:1.45;word-break:break-word;background:#fff;color:#111}
.them .bub{border-top-left-radius:6px}
.them.cont .bub{border-top-left-radius:19px}
.me .bub{background:var(--acc);color:#fff;border-top-right-radius:6px}
.me.cont .bub{border-top-right-radius:19px}
.bub.pic{padding:0;overflow:hidden;background:transparent !important;border-radius:14px !important}
.bub.pic img{display:block;width:200px;height:auto}
.bub.pic .noimg{width:200px;height:140px;background:#c9ced6;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.bub.call{display:flex;align-items:center;gap:9px;padding:10px 14px}
.bub.call .cic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.bub.call small{display:block;font-size:11px;opacity:.65}
.dots{display:flex;gap:5px;padding:14px 15px}
.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#b3b8c1}
.c-in{background:#fff;flex:none;border-top:1px solid #e6e8ec}
.c-in-row{display:flex;align-items:center;gap:12px;padding:8px 12px 4px}
.c-field{flex:1;min-width:0;background:#f1f2f5;border-radius:20px;height:38px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px 0 14px;font-size:15px}
.c-field .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-field.ph .tx{color:#9a9ea8}
.c-send{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}

.s-head{background:#f6f6f8;border-bottom:1px solid #e3e3e8;flex:none}
.s-bar{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:0 12px 8px}
.s-who{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.s-av{width:50px;height:50px;border-radius:50%;background:linear-gradient(#a7acb7,#858a95);color:#fff;font-size:21px;font-weight:500;display:flex;align-items:center;justify-content:center}

.line-island svg{position:absolute;left:13px;top:11px}
.line-island i{position:absolute;left:104px;top:15px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f8a455,#ea8a37)}
.line-mic{position:absolute;top:23px;left:284px;width:13px;height:13px;border-radius:50%;background:#000;z-index:3}
.line-mic:after{content:"";position:absolute;left:3px;top:3px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f8a455,#ea8a37)}
.line-head{margin-top:60px;height:26px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:20px;font-weight:600;color:rgba(255,255,255,.52);white-space:nowrap;font-variant-numeric:tabular-nums}
.line-head svg{width:17px;height:17px;flex:none}

.line-sp{flex:1}
.line-btn{display:grid;place-items:center;border-radius:50%;box-sizing:border-box;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.15));border:1px solid rgba(35,35,33,.4);box-shadow:inset 0 1.5px 1.5px rgba(255,255,255,.42),inset 0 -1.5px 2px rgba(255,255,255,.16);color:#fff;padding:0;font:inherit}
.line-btn.red{background:linear-gradient(180deg,#d63a2e,#c92f24);border-color:#e4574c;box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -1px 2px rgba(0,0,0,.12)}
.line-act{display:flex;justify-content:space-between;padding:0 28px;margin-bottom:20px}
.line-sm{width:100px;display:flex;flex-direction:column;align-items:center}
.line-sm .line-btn{width:45px;height:45px}
.line-lbl{margin-top:6px;font-size:14px;line-height:18px;text-align:center;color:#fff}
.line-slide{position:relative;margin:0 32px;height:91px;box-sizing:border-box;padding:6px;border-radius:46px;display:flex;align-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1.5px 2px rgba(255,255,255,.55),inset 0 -1.5px 2px rgba(255,255,255,.22),0 2px 10px rgba(0,0,0,.06)}
.line-handle{width:79px;height:79px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.16);touch-action:none;position:relative;z-index:2}
.line-st{position:absolute;left:92px;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;padding-right:8px;font-size:22px;font-weight:500;letter-spacing:.02em;color:rgba(255,255,255,.52);pointer-events:none}
.line-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:23px 0;padding:0 19px}
.line-cell{display:flex;flex-direction:column;align-items:center}
.line-cell .line-btn{width:79px;height:79px}
.line-cell .line-lbl{margin-top:5px}
.line-call.ended .line-head{color:rgba(255,255,255,.27)}.line-call.ended .line-head svg{opacity:.4}
.line-call.ended .line-name{opacity:.5}
.line-call.ended .line-btn svg{opacity:.5}
.line-call.ended .line-btn.red svg{opacity:.55}
.line-call.noanswer .line-head{color:rgba(255,255,255,.52)}
.line-call.declined .line-head{color:rgba(255,255,255,.42)}.line-call.hungup .line-head{color:rgba(255,255,255,.4)}.line-call.declined .line-name{opacity:.62}

.c-callbar{display:flex;justify-content:space-around;padding:14px 0 12px;background:#f4f5f7;color:#6b7280}.c-callbar.dk{background:#111;color:#9aa0aa}
.c-callbar span,.c-callbar button{display:flex;flex-direction:column;align-items:center;gap:6px}.c-callbar button{border:0;background:none;color:inherit;font:inherit;padding:0 34px;cursor:pointer}.c-callbar small{font-size:12px}
.bub.rec{padding:0;min-width:210px;overflow:hidden}
.rec-top{display:flex;align-items:center;gap:12px;padding:12px 14px}
.rec-ic{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center;flex:none}
.bub.rec.nodur .rec-top{min-height:66px;box-sizing:border-box}.them .bub.rec .rec-ic{background:#f1f2f4}.them .bub.rec .rec-note{border-top-color:#eceef1}.c-in-row.c-blocked{justify-content:center;color:#9aa0a8;font-size:15px;min-height:44px}.rec-top b{display:block;font-size:15px}.rec-top small{display:block;font-size:13px;opacity:.7;margin-top:2px}
.rec-note{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid rgba(0,0,0,.14);font-size:13px}
.rec-note i{margin-left:auto;font-style:normal;opacity:.6}.rec-nic{width:22px;height:22px;border-radius:7px;background:#18b66a;display:grid;place-items:center;flex:none}
</style>

function bindWatch(){const v=document.getElementById('wvid');if(!v)return;applyLand();
 const bar=document.getElementById('wbar'),tm=document.getElementById('wtime'),ct=document.getElementById('wcenter');
 const upd=()=>{if(bar)bar.style.width=(v.duration?v.currentTime/v.duration*100:0)+'%';if(tm)tm.textContent=fmtTime(v.currentTime)+' / '+fmtTime(v.duration)};
 const icon=()=>{if(ct)ct.style.opacity=v.paused?'1':'0'};
 for(const ev of ['timeupdate','loadedmetadata','durationchange'])v.addEventListener(ev,upd);
 for(const ev of ['play','pause','ended'])v.addEventListener(ev,icon);
 const msg=document.createElement('div');msg.className='watch-err';msg.hidden=true;msg.textContent='この動画はこのブラウザでは再生できません（iPhoneのSafariなら再生できる場合があります。mp4(H.264)なら確実です）';v.parentElement.appendChild(msg);
 v.addEventListener('error',()=>{msg.hidden=false;if(ct)ct.style.opacity='0'});

 v.addEventListener('loadeddata',go);v.addEventListener('canplay',go);
 icon();v.load();go()}

  const A=S.sequence.steps,i=A.indexOf(scene);if(i<0)return null;

      for(const m of mids.reverse()){const nm=m.name||S.chat.name||'';L=L.filter(n=>!(n.miss&&String(n.sender||'')===String(nm)));L.push({id:uid(),app:'phone',label:m.label==null?'電話':m.label,when:'今',sender:nm,text:m.note||'不在着信',miss:1,badge:Math.max(1,Math.floor(+m.times)||1)})}

const OCR_BASE='https://cdn.jsdelivr.net/npm/';
let ocrWorker=null,ocrBusy=false;
function ocrSt(m){const el=document.getElementById('scn-ocr-st');if(!el)return;el.textContent=m||'';el.hidden=!m}

function ocrImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('img'));im.src=fr.result};fr.onerror=()=>rej(new Error('img'));fr.readAsDataURL(file)})}
function ocrBlur(g,w,h,r){
  const W=w+1,I=new Float64Array(W*(h+1));
  for(let y=0;y<h;y++){let row=0;for(let x=0;x<w;x++){row+=g[y*w+x];I[(y+1)*W+x+1]=I[y*W+x+1]+row}}

  for(let y=0;y<h;y++){const y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);for(let x=0;x<w;x++){const x0=Math.max(0,x-r),x1=Math.min(w,x+r+1);o[y*w+x]=(I[y1*W+x1]-I[y0*W+x1]-I[y1*W+x0]+I[y0*W+x0])/((x1-x0)*(y1-y0))}}
  return o;
}
function ocrPrep(img,mode){
  const sc=Math.min(1,1200/img.naturalWidth,2600/img.naturalHeight);
  const w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,w,h);
  const id=cx.getImageData(0,0,w,h),d=id.data,n=w*h,g=new Float32Array(n);let sum=0;
  for(let i=0,j=0;i<n;i++,j+=4){const v=.299*d[j]+.587*d[j+1]+.114*d[j+2];g[i]=v;sum+=v}
  const dark=sum/n<128,out=new Uint8ClampedArray(n);
  if(mode==='b'){
    const bg=ocrBlur(g,w,h,Math.max(6,Math.round(w/45))),pol=dark?1:-1;
    for(let i=0;i<n;i++)out[i]=255-Math.max(0,Math.min(255,pol*(g[i]-bg[i])*6));
  }else{
    const hist=new Uint32Array(256);for(let i=0;i<n;i++)hist[g[i]|0]++;
    let acc=0,lo=0,hi=255;for(let v=0;v<256;v++){acc+=hist[v];if(acc>=n*.01){lo=v;break}}
    acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>=n*.01){hi=v;break}}
    const k=255/Math.max(40,hi-lo);
    for(let i=0;i<n;i++){const v=Math.max(0,Math.min(255,(g[i]-lo)*k));out[i]=dark?255-v:v}
  }
  for(let i=0,j=0;i<n;i++,j+=4){d[j]=d[j+1]=d[j+2]=out[i];d[j+3]=255}
  cx.putImageData(id,0,0);return cv;
}
function ocrParse(lines,W,H){

  const all=L.map(l=>l.t).join('\n'),has=r=>r.test(all);
  let kind=null;
  const au=L.map(l=>l.t.match(/オーデ[ィイ]オ(.*)$/)).find(m=>m&&!/ビデオ|消音/.test(m[1]));
  if(au)kind=/拒|否/.test(au[1])?'declined':/終|了|竹|丁/.test(au[1])?'hungup':/^[.…・。,，、\s]*$/.test(au[1])?'call':null;
  if(kind){}
  else if(has(/オーディオ拒|ディオ拒否/))kind='declined';

  else if(has(/応答がありません|応答がありま|応答なし/))kind='noanswer';
  else if(has(/呼び出し中|呼出中/))kind='outgoing';
  else if(has(/不在着信/))kind='missed';
  else if(has(/通話終了|通話が終了/))kind='ended';
  else if(has(/通話中/)||(has(/(^|\D)\d{1,2}:\d{2}(\D|$)/)&&has(/スピーカー|ミュート|キーパッド/)))kind='connected';
  else if(has(/スライド.{0,3}応答|着信|から電話|音声通話|ビデオ通話/))kind='call';
  else if(has(/\d{1,2}月\d{1,2}日/)&&has(/[月火水木金土日]曜/))kind='lock';
  if(!kind)return {kind:null,lines:L};
  const KW=/オーディオ|拒否|終了|応答|呼び出し|着信|通話|スライド|スピーカー|ミュート|キーパッド|ビデオ|通知|曜日|^\d{1,2}[:：]\d{2}$|^[\d%.:：\s]+$|^LINE$|^[^\wぁ-んァ-ヶ一-龠]+$/i;

async function ocrRun(file){
  if(ocrBusy)return;ocrBusy=true;
  try{
    if(S.sequence.steps.length>=300){toast('シーンは300件までです');return}
    ocrSt('画像を読み込み中…');
    const img=await ocrImage(file);
    ocrSt('文字を読むための準備中…（初回は数MBを読み込みます）');
    const wk=await ocrGetWorker();
    let res=null;
    for(const mode of ['a','b']){
      const cv=ocrPrep(img,mode);
      const {data}=await wk.recognize(cv);
      res=ocrParse(data.lines||[],cv.width,cv.height);
      if(window.__ocrLog)window.__ocrLog.push({mode,kind:res.kind,lines:(data.lines||[]).map(l=>[l.text.replace(/\s+/g,''),l.bbox.y1-l.bbox.y0,Math.round(l.bbox.y0)])});
      if(res.kind)break;
    }
    if(!res||!res.kind){ocrSt('');toast('場面の種類を読み取れませんでした。下の「場面を足す」から選んでください');return}
    const st=scnNew(res.kind);
    if(res.name)st.name=res.name;
    if(res.kind==='missed'){st.times=res.times;st.app='line';st.note=res.voice?'不在着信（音声通話）':'不在着信';st.duration='00:01'}
    else if(['call','connected','ended','outgoing'].includes(res.kind)){st.app=res.app;st.duration=res.duration||(res.app==='line'?'00:01':'00:12');if(res.app==='line')st.returnTo='lock'}
    else if(res.kind==='declined'||res.kind==='hungup'){st.app='line';st.duration='00:01'}
    scnInsert(st);commit(true);ocrSt('');
    document.querySelector('#editor .scn.open')?.scrollIntoView({block:'nearest'});
    toast(`「${SCN[res.kind][0]}」として入れました${res.name?`（相手：${res.name}）`:''}。違うときは、この場面を直してください`);
  }catch(err){
    ocrSt('');toast('読み取りできませんでした。インターネットにつながっているか確認してください');
  }finally{ocrBusy=false;ocrSt('')}
}

function parseBulk(t,key){
  const out=[]; const name=String((key==='chat'?S.chat:key==='sms'?S.sms:get(key)).name||'').trim();

    let s=line.trim(); if(!s) return;
    let m;
    if((m=s.match(/^(?:-{2,}|―+|ー{3,}|={2,})\s*(.*?)\s*[-=―]*$/))){out.push({id:uid(),type:'date',text:m[1]||'今日'});return}

function readImage(file,max){

    const fr=new FileReader();

      const k=Math.min(1,max/Math.max(img.width,img.height));

  });

async function savePptx(btn){
  if(!frames.length)return; const old=btn.textContent; btn.disabled=true; btn.textContent='作成中…';
  try{
    const blob=await buildPptx(frames),name=baseName()+'.pptx';
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}
    }
    const dl=await getDl();
    if(dl){try{await dl.save({filename:name,data:blob});toast('保存しました')}catch(e){if(!e||e.code!=='declined')toast('保存できませんでした')}return}
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),20000);
  }catch(err){toast('Keynote用ファイルを作れませんでした')}

}

/* 写真から下書きを作る：文字認識(OCR)でロック画面の日付・時刻・通知を読み取る（初回のみ認識データをネットから取得） */
let _tess=null;
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  if(_tess)return _tess;
  return _tess=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=res;sc.onerror=()=>{_tess=null;rej(new Error('net'))};document.head.appendChild(sc)});
}
const OCR_LANG='https://cdn.jsdelivr.net/npm/@tesseract.js-data/jpn@1.0.0/4.0.0_best_int';
function ocrClean(t){
  t=t.replace(/(?<=[^\x00-\x7F])\s+|\s+(?=[^\x00-\x7F])/g,'').replace(/\s{2,}/g,' ').trim();
  return t.replace(/(?<=[^\x00-\x7F])\?/g,'？').replace(/(?<=[^\x00-\x7F])!/g,'！');
}
function ocrLines(d){return d.lines||(d.blocks||[]).flatMap(b=>b.paragraphs.flatMap(p=>p.lines))}
async function ocrPhoto(file,onStep){
  await loadTess();
  onStep&&onStep('認識データを読み込み中…（初回のみ少し時間がかかります）');
  const w=await Tesseract.createWorker('jpn',1,{langPath:OCR_LANG});
  try{
    const bmp=await createImageBitmap(file),H=bmp.height,Wd=bmp.width;
    onStep&&onStep('文字を読み取り中…');
    const lines=ocrLines((await w.recognize(file,{},{blocks:true})).data).map(l=>({y0:l.bbox.y0,y1:l.bbox.y1,x0:l.bbox.x0,x1:l.bbox.x1,t:ocrClean(l.text)})).filter(l=>l.t);
    // 日付
    let date='',dl=null;
    for(const l of lines){const m=l.t.match(/(\d{1,2})月(\d{1,2})日\s*(.{1,2}曜日?)/);if(m&&l.y0<H*0.5){date=`${m[1]}月${m[2]}日 ${m[3].replace(/曜日?$/,'')}曜日`;dl=l;break}}
    // 通知の領域：日付より下、下端のボタンより上
    const top=dl?dl.y1:H*0.2,body=lines.filter(l=>l!==dl&&l.y0>top+H*0.12&&l.y1<H*0.9);
    // 時計：日付の下の大きな数字を、別に読み取る
    let time='';
    try{
      const y0=Math.round(top+H*0.005),y1=Math.round(Math.min(top+H*0.2,body.length?body[0].y0:H*0.4)),hh=Math.max(40,y1-y0);
      const c=document.createElement('canvas'),sc=120/hh;c.width=Math.round(Wd*sc);c.height=120;const cx=c.getContext('2d',{willReadFrequently:true});
      cx.drawImage(bmp,0,y0,Wd,hh,0,0,c.width,120);const im=cx.getImageData(0,0,c.width,120),a=im.data;
      let lum=0;for(let i=0;i<a.length;i+=4)lum+=a[i]*.3+a[i+1]*.59+a[i+2]*.11;lum/=a.length/4;
      for(let i=0;i<a.length;i+=4){let g=a[i]*.3+a[i+1]*.59+a[i+2]*.11;g=lum<128?255-g:g;g=g>150?255:g<110?0:g;a[i]=a[i+1]=a[i+2]=g}

      const r=await w.recognize(c);const m=r.data.text.replace(/：/g,':').match(/(\d{1,2})\s*:\s*(\d{2})/);if(m)time=m[1].padStart(2,'0')+':'+m[2];

      return {id:uid(),app:isSms?'sms':'chat',label:isSms?'':head,sender:sender||head,text,when:''};
    });
    return {date,time,notifs};
  }finally{try{await w.terminate()}catch(e){}}
}
async function importPhoto(file){
  const t=document.getElementById('toast');
  const say=m=>toast(m);
  try{
    say('読み取りを始めます…');
    const r=await ocrPhoto(file,say);
    if(!r.notifs.length&&!r.date&&!r.time){toast('文字を読み取れませんでした。ロック画面のスクリーンショットを選んでください');return}
    if(!save())throw Error('save');
    const sc=defaults();sc.mode='lock';
    if(r.date)sc.lock.date=r.date;if(r.time)sc.lock.time=r.time;
    if(r.notifs.length)sc.lock.notifs=r.notifs;
    const c={id:uid(),name:'写真から作成 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),folder:folderId||'',script:validateScript(JSON.parse(JSON.stringify(sc)))};
    book.chapters.push(c);book.active=c.id;S=c.script;previewN=null;renderChapters();commit(true);go('home');
    toast('下書きを作りました。文字の読み間違いがないか確認してください'+(r.time?'':'（時刻は読み取れませんでした）'));
  }catch(err){toast(err&&err.message==='net'?'読み取り用のデータを取得できません。ネットにつないでからもう一度試してください':'読み取りに失敗しました')}
}

  const old=btn.textContent; btn.textContent='書き出し中…'; btn.disabled=true;

    }

async function buildFrames(btn){
  const len=modeList().length, hide=S.play.tap?Math.min(len,+S.play.hide||0):0;
  resetFrames();
  const start=isSceneMode()?0:len-hide, end=maxPosition(), base=baseName();
  for(let n=start;n<=end;n= n===end ? end+1 : nextReveal(n)){
    btn.textContent=`書き出し中… ${n-start+1}/${end-start+1}`;
    const blob=await shot({reveal:isSceneMode()||hide?n:undefined});
    frames.push({blob,name:`${base}-${String(n-start+1).padStart(2,'0')}.png`,url:URL.createObjectURL(blob)});
  }
}
async function exportFrames(btn){
  if(typeof html2canvas!=='function'){toast('画像書き出しの部品を読み込めませんでした（ページを再読み込みしてください）');return}
  if(!isSceneMode()&&(!S.play.tap||!(+S.play.hide))){toast('撮影モードをオンにして「最初は隠しておく数」を1以上にしてください');return}
  const old=btn.textContent; btn.disabled=true;
  try{ await buildFrames(btn); showGallery(await getDl()); }
  catch(err){toast('書き出しに失敗しました')}
  finally{btn.textContent=old;btn.disabled=false}
}
/* Portable script files: validates both the supplied template format and the earlier chat format. */
function validateScript(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Invalid script');

    if(typeof raw.name!=='string'||typeof raw.time!=='string'||typeof raw.date!=='string')throw Error('Invalid legacy script');

  }
  const d=defaults(), text=(v,f='',max=20000)=>{if(v===undefined)return f;if(typeof v!=='string'||v.length>max)throw Error('Invalid text');return v},
    number=(v,f,min,max)=>{if(v===undefined)return f;if(!Number.isFinite(+v))throw Error('Invalid number');return Math.max(min,Math.min(max,+v))},
    bool=(v,f)=>v===undefined?f:typeof v==='boolean'?v:(()=>{throw Error('Invalid boolean')})(),
    color=(v,f)=>{if(v===undefined)return f;if(!/^#[0-9a-f]{6}$/i.test(v))throw Error('Invalid color');return v},
    pic=v=>{if(!v)return null;if(typeof v!=='string'||v.length>12000000||!/^data:image\/(png|jpeg|webp|gif);base64,[a-z0-9+/=]+$/i.test(v))throw Error('Invalid image');return v};
  if(!['desktop','chat','sms','lock','sequence','talks','video'].includes(raw.mode))throw Error('Invalid mode');d.mode=raw.mode;
  for(const key of ['status','chat','sms','lock','play','export'])if(!raw[key]||typeof raw[key]!=='object'||Array.isArray(raw[key]))throw Error('Invalid section');
  if(raw.phone){const v=raw.phone;d.phone={wall:pic(v.wall),chatName:text(v.chatName,'ことば',40),smsName:text(v.smsName,'メッセージ',40),videoName:text(v.videoName,'ナガメ',40),chatIcon:pic(v.chatIcon),smsIcon:pic(v.smsIcon),videoIcon:pic(v.videoIcon)}}
  let a=raw.status;d.status={time:text(a.time,d.status.time,50),battery:number(a.battery,38,0,100),signal:number(a.signal,3,0,4),wifi:bool(a.wifi,true),show:bool(a.show,true),carrier:text(a.carrier,'',100)};
  function msgs(list){if(!Array.isArray(list)||list.length>300)throw Error('Invalid messages');return list.map(m=>{if(!m||!['text','image','call','date','system'].includes(m.type))throw Error('Invalid type');return {id:uid(),type:m.type,from:m.from==='me'?'me':'them',text:text(m.text),time:text(m.time,'',100),read:bool(m.read,false),draftOnly:bool(m.draftOnly,false),typingBefore:bool(m.typingBefore,false),dur:text(m.dur,'',20),note:text(m.note,'',60),yomi:text(m.yomi,'',500),img:pic(m.img)}})}
  a=raw.chat;d.chat={name:text(a.name,'',100),duration:text(a.duration,'00:12',20),returnTo:['chat','sms','video','lock'].includes(a.returnTo)?a.returnTo:'chat',unread:number(a.unread,0,0,9999),avatar:pic(a.avatar),avColor:color(a.avColor,d.chat.avColor),accent:color(a.accent,d.chat.accent),bg:Object.hasOwn(CHATBG,a.bg)?a.bg:'sky',bgImg:pic(a.bgImg),showName:bool(a.showName,false),top:bool(a.top,false),typing:bool(a.typing,false),callDur:text(a.callDur,'',20),callFrom:text(a.callFrom,'',20),draft:text(a.draft),lockStart:bool(a.lockStart,false),lockSender:text(a.lockSender,'',100),lockText:text(a.lockText,'',500),messages:msgs(a.messages)};
  a=raw.sms;d.sms={name:text(a.name,'',100),duration:text(a.duration,'00:12',20),returnTo:['chat','sms','video','lock'].includes(a.returnTo)?a.returnTo:'chat',accent:color(a.accent,d.sms.accent),messages:msgs(a.messages)};
  a=raw.lock;if(!Array.isArray(a.notifs)||a.notifs.length>300)throw Error('Invalid notifications');const cn=n=>{if(!n||!Object.hasOwn(APPS,n.app))throw Error('Invalid app');return {id:uid(),app:n.app,label:text(n.label,'',100),sender:text(n.sender,'',200),text:text(n.text),when:text(n.when,'',100),...(n.miss?{miss:1,badge:Math.max(1,Math.min(99,Math.floor(+n.badge)||1))}:{})}};d.lock={time:text(a.time,'21:47',50),date:text(a.date,'',100),font:Object.hasOwn(FONTS,a.font)?a.font:'sys',wall:Object.hasOwn(WALLS,a.wall)?a.wall:'night',wallImg:pic(a.wallImg),notifs:a.notifs.map(cn)};{const rc=raw.chat||{};d.chat.lockNotifs=Array.isArray(rc.lockNotifs)?rc.lockNotifs.slice(0,50).map(cn):[];d.chat.lockAll=bool(rc.lockAll,false);d.chat.callResult=rc.callResult==='noanswer'?'noanswer':'answer';d.chat.blocked=bool(rc.blocked,false)}
  if(raw.video!==undefined){const v=raw.video;if(!v||!Array.isArray(v.items)||v.items.length>100)throw Error('Invalid videos');d.video={name:text(v.name,'',100),handle:text(v.handle,'',100),subscribers:text(v.subscribers,'',150),description:text(v.description,'',1000),avatar:pic(v.avatar),banner:pic(v.banner),myAvatar:pic(v.myAvatar),videoCount:text(v.videoCount,'',60),labels:(l=>{const o={};if(l&&typeof l==='object'&&!Array.isArray(l))for(const [k,val] of Object.entries(l))if(/^[A-Za-z0-9]{1,30}$/.test(k)&&typeof val==='string'&&val.length<=100)o[k]=val;return o})(v.labels),items:v.items.map(x=>{if(!x||typeof x!=='object')throw Error('Invalid video');return {id:uid(),title:text(x.title,'',300),channel:text(x.channel,'',100),target:bool(x.target,false),meta:text(x.meta,'',200),duration:text(x.duration,'',30),theme:['city','warm','sea','forest','night'].includes(x.theme)?x.theme:'city',img:pic(x.img),avatar:pic(x.avatar),likes:text(x.likes,'',40),...vidFields(x)}})};

  if(raw.talks!==undefined){if(!raw.talks||!Array.isArray(raw.talks.items)||raw.talks.items.length>100)throw Error('Invalid talks');d.talks.items=raw.talks.items.map(x=>{if(!x||typeof x!=='object')throw Error('Invalid talk');return {id:uid(),name:text(x.name,'',100),text:text(x.text),time:text(x.time,'',100),unread:Math.floor(number(x.unread,0,0,999)),color:color(x.color,'#6d9be5'),target:bool(x.target,false),img:pic(x.img),messages:Array.isArray(x.messages)?msgs(x.messages):[]}})}
  if(raw.sequence!==undefined){if(!raw.sequence||!Array.isArray(raw.sequence.steps)||!raw.sequence.steps.length||raw.sequence.steps.length>300)throw Error('Invalid scenes');d.sequence.steps=raw.sequence.steps.map(a=>{if(!a||!['lock','chat','call','banner','outgoing','connected','ended','missed','noanswer','declined','hungup'].includes(a.kind))throw Error('Invalid scene');return {kind:a.kind,count:Math.floor(number(a.count,0,0,300)),name:text(a.name,'',100),duration:text(a.duration,'00:12',20),label:text(a.label,'電話',30),note:text(a.note,a.kind==='noanswer'?'応答なし':'不在着信',60),times:Math.floor(number(a.times,1,1,99)),returnTo:['chat','sms','video','lock','none'].includes(a.returnTo)?a.returnTo:'chat',app:a.app==='line'?'line':'kotoba',...(a.kind==='lock'&&Array.isArray(a.notifs)&&a.notifs.length<=100?(l=>({notifs:l,count:l.length}))(a.notifs.map(cn)):{}),...(a.kind==='chat'&&Array.isArray(a.messages)?{messages:msgs(a.messages)}:{})}})}
  a=raw.play;d.play={tap:bool(a.tap,true),hide:number(a.hide,2,0,300),nativeBars:bool(a.nativeBars,true),kana:bool(a.kana,true),script:bool(a.script,true)};d.export.size=raw.export.size==='std'?'std':'device';return d;
}
function downloadBlob(blob,name){if(window.claude&&window.claude.use){getDl().then(dl=>{if(dl)return dl.save({filename:name,data:blob}).catch(()=>{});legacyDownload(blob,name)});return}legacyDownload(blob,name)}
function legacyDownload(blob,name){if(window.kotobaNative){const reader=new FileReader();reader.onload=()=>window.webkit.messageHandlers.studio.postMessage({kind:"export",name,data:reader.result});reader.readAsDataURL(blob);return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
